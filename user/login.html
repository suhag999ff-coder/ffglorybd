<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF GLORY - Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 20px;">
                <img src="https://i.ibb.co/vz3Z4Z8/logo.png" alt="Logo" style="width: 60px; height: 60px; border-radius: 12px; margin-bottom: 10px;">
                <h2 style="font-family:'Space Grotesk'; font-size: 1.8rem;" id="pageTitle">Welcome Back</h2>
                <p style="color: var(--muted); font-size: 0.9rem;">Sign in to <span style="color: var(--gold);">FF Glory</span></p>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchAuth('login')">Sign In</div>
                <div class="auth-tab" onclick="switchAuth('signup')">Sign Up</div>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
                <p id="loginError" style="color: red; font-size: 0.8rem; text-align: center; margin-top: 10px;"></p>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" style="display: none;">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="signupUsername" placeholder="Choose a username" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="Create a password" required>
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
                <p id="signupError" style="color: red; font-size: 0.8rem; text-align: center; margin-top: 10px;"></p>
            </form>

            <div style="text-align: center; margin-top: 20px;">
                <button onclick="changeLanguage('en')" class="badge">EN</button>
                <button onclick="changeLanguage('bn')" class="badge">বাংলা</button>
                <button onclick="changeLanguage('hi')" class="badge">हिंदी</button>
                <button onclick="changeLanguage('ar')" class="badge">العربية</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/translations.js"></script>
    <script>
        function switchAuth(type) {
            if(type === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('signupForm').style.display = 'none';
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.querySelectorAll('.auth-tab')[1].classList.remove('active');
                document.getElementById('pageTitle').innerText = 'Welcome Back';
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('signupForm').style.display = 'block';
                document.querySelectorAll('.auth-tab')[0].classList.remove('active');
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('pageTitle').innerText = 'Create Account';
            }
        }

        // Login Logic
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const email = `${username}@ffglory.com`;

            auth.signInWithEmailAndPassword(email, password)
                .then(() => window.location.href = "dashboard.html")
                .catch((error) => {
                    document.getElementById('loginError').innerText = "Invalid username or password!";
                });
        });

        // Signup Logic
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('signupUsername').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;

            if(password !== confirmPassword) {
                document.getElementById('signupError').innerText = "Passwords do not match!";
                return;
            }

            const email = `${username}@ffglory.com`;
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // ডাটাবেসে ইউজার তৈরি করা
                    db.ref('users/' + userCredential.user.uid).set({
                        username: username,
                        basic: 0,
                        special: 0,
                        createdAt: new Date().toISOString()
                    });
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    document.getElementById('signupError').innerText = error.message;
                });
        });
    </script>
</body>
</html>
