<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF GLORY - Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="justify-content:center; align-items:center;">

    <div class="card" style="width: 90%; max-width: 400px; margin-top: 50px;">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="https://i.ibb.co/vz3Z4Z8/logo.png" alt="Logo" style="width: 60px; height: 60px; border-radius: 12px; margin-bottom: 10px;"> <!-- Logo URL add korte parben -->
            <h2 style="font-family:'Space Grotesk'; font-size: 1.8rem;">Welcome Back</h2>
            <p style="color: var(--muted); font-size: 0.9rem;">Sign in to <span style="color: var(--gold);">FF Glory</span></p>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px; background: #0f172a; padding: 5px; border-radius: 10px;">
            <button class="btn btn-primary" style="border-radius: 8px;">Sign In</button>
            <button class="btn" style="background: transparent; color: var(--muted);" onclick="window.location.href='register.html'">Sign Up</button>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label data-i18n="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            <div class="input-group">
                <label data-i18n="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary" data-i18n="signIn">Sign In</button>
            <p id="error-msg" style="color: red; font-size: 0.8rem; text-align: center; margin-top: 10px;"></p>
        </form>
    </div>

    <!-- Language Selector -->
    <div style="margin-top: 20px; display:flex; gap:10px;">
        <button onclick="changeLanguage('en')" class="badge">EN</button>
        <button onclick="changeLanguage('bn')" class="badge">বাংলা</button>
        <button onclick="changeLanguage('hi')" class="badge">हिंदी</button>
        <button onclick="changeLanguage('ar')" class="badge">العربية</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
